<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06171F">
<title>Alkyon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:#06171F;color:#E6F1F2;font:16px system-ui,sans-serif}body{display:grid;place-items:center}a{color:#FF7A4D}</style>
<script src="migrate.js"></script>
<script>
/* Alkyon: η εφαρμογή είναι στο v4/. Η κλασική έκδοση αποσύρθηκε στην 1.4.0 (το classic.html ανακατευθύνει εδώ).
   Οι συντομεύσεις (?a=bite|trip|fc) περνούν στη νέα εφαρμογή. Ο service worker της ρίζας μένει για τις ειδοποιήσεις. */
(function(){
  var a=''; try{ a=new URLSearchParams(location.search).get('a')||''; }catch(e){}
  var M={bite:'#new',trip:'#trip',fc:'#forecast',log:'#log',map:'#map',prof:'#profile'};
  if(a&&!M[a]){ location.replace('classic.html'+location.search); return; } /* το classic.html μεταφράζει τις παλιές συντομεύσεις */
  /* 1.4.0: σύνδεσμοι από email (επιβεβαίωση, νέος κωδικός): τους χειρίζεται πλέον η νέα εφαρμογή (v4/account.js) */
  if(/access_token|type=recovery|error_description/.test(location.hash)){ location.replace('v4/'+location.search+location.hash); return; }
  if(/^#inbox/.test(location.hash)){ location.replace('v4/#inbox'); return; }
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  location.replace('v4/'+(M[a]||location.hash||''));
})();
</script>
</head>
<body><p>Alkyon… <a href="v4/">Άνοιγμα</a></p></body>
</html>
