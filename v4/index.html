(function(){ var K='psaro-errlog'; function add(m,w){ try{ m=String(m||'').slice(0,300); if(!m||/^Script error\.?$/.test(m)||/ResizeObserver loop/.test(m)) return; var a=JSON.parse(localStorage.getItem(K)||'[]'), last=a[a.length-1];
  if(last&&last.m===m&&last.w===w){ last.n=(last.n||1)+1; last.t=Date.now(); } else a.push({t:Date.now(),m:m,w:w||'',v:window.PSARO_VERSION||'',p:location.hash||''}); localStorage.setItem(K,JSON.stringify(a.slice(-30))); }catch(e){} }
  window.addEventListener('error',function(e){ if(e.target&&e.target!==window) return; add(e.message,(e.filename||'').split('/').pop()+':'+(e.lineno||'')+':'+(e.colno||'')); });
  window.addEventListener('unhandledrejection',function(e){ var r=e.reason; if(r&&(r.name==='AbortError'||/Failed to fetch|NetworkError|Load failed/i.test(r.message||''))) return; add('Promise: '+(r&&(r.message||r)),r&&r.stack?String(r.stack).split('\n')[1]||'':''); });
  window.PsaroErrLog={get:function(){ try{ return JSON.parse(localStorage.getItem(K)||'[]'); }catch(e){ return []; } },clear:function(){ try{ localStorage.removeItem(K); }catch(e){} },add:add};
})();</script>
