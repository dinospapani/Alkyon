# Alkyon · ανέβασμα της ιστοσελίδας στο Cloudflare (https://alkyonfishing.com).
# Τρέχει αφού περάσουν οι έλεγχοι του main («Alkyon tests»), μετά από κάθε ενημέρωση δεδομένων (οι αυτόματες ενημερώσεις κάνουν push
# με το GITHUB_TOKEN, που δεν ξεκινά άλλα workflows, γι' αυτό το workflow_run), και με το χέρι από την καρτέλα Actions.
# Σε κάθε περίπτωση, πριν ανέβει: ο τελευταίος έλεγχος του main πρέπει να έχει περάσει, και τρέχουν ξανά τα unit tests (P0.8).
# Χρειάζεται τα secrets CLOUDFLARE_API_TOKEN και CLOUDFLARE_ACCOUNT_ID. Χωρίς αυτά απλώς προειδοποιεί και σταματά.
name: Alkyon web (Cloudflare)
on:
  # 1.14.83 (P0.8): ανεβαίνει μόνο μετά από επιτυχημένους ελέγχους («Alkyon tests») στο main — όχι πια απευθείας σε κάθε push.
  workflow_run:
    workflows: ['Alkyon tests', 'Coastline sync (OSM)', 'Dams fullness sync (WDD)', 'Alkyon Navigator sync', 'Greek coastal places (OSM)', 'Shoals and rocks (OSM)']
    types: [completed]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Έλεγχος secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Λείπουν τα secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — το alkyonfishing.com δεν ενημερώθηκε."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
        with:
          # μετά από «Alkyon tests»: ακριβώς το commit που ελέγχθηκε· μετά από ενημέρωση δεδομένων ή με το χέρι: το main
          ref: ${{ github.event.workflow_run.name == 'Alkyon tests' && github.event.workflow_run.head_sha || 'main' }}
      - name: Πύλη ελέγχων (P0.8)
        if: steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ο τελευταίος ολοκληρωμένος έλεγχος του main πρέπει να έχει περάσει (καλύπτει ενημερώσεις δεδομένων και ανέβασμα με το χέρι)
          C=$(gh run list -R "$GITHUB_REPOSITORY" -w "Alkyon tests" -b main -s completed -L 1 --json conclusion -q '.[0].conclusion')
          echo "Τελευταίος έλεγχος main: ${C:-κανένας}"
          [ "$C" = "success" ] || { echo "::error::Οι έλεγχοι του main δεν έχουν περάσει — δεν ανεβαίνει."; exit 1; }
          node --test tests/unit/*.test.mjs
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.chk.outputs.skip != '1'
        run: npm ci --no-audit --no-fund
      - name: Αρχεία της ιστοσελίδας → dist/web
        if: steps.chk.outputs.skip != '1'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}   # για το apple-app-site-association (Universal Links του iOS)
        run: node tools/build-web.mjs dist/web
      - name: Ανέβασμα στο Cloudflare
        if: steps.chk.outputs.skip != '1'
        run: npx wrangler deploy
      - name: Έλεγχος ότι απαντά
        if: steps.chk.outputs.skip != '1'
        run: |
          sleep 10
          V=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" version.js | head -1)
          curl -fsS "https://alkyonfishing.com/version.js?t=$(date +%s)" | grep -q "$V" && echo "OK: alkyonfishing.com έχει την $V" || echo "::warning::Το alkyonfishing.com δεν δείχνει ακόμα την $V (DNS/πιστοποιητικό την πρώτη φορά μπορεί να αργήσουν λίγα λεπτά)"
          curl -fsS https://alkyonfishing.com/.well-known/assetlinks.json >/dev/null && echo "OK: assetlinks.json" || echo "::warning::Δεν απαντά το /.well-known/assetlinks.json"
