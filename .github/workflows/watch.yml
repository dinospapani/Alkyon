# Alkyon · έλεγχος χτισίματος των ρολογιών (Wear OS και Apple Watch) και του κινητού με τη σύνδεση ρολογιού.
# Δεν ανεβάζει τίποτα σε Play / TestFlight: μόνο χτίζει και κρατά τα αρχεία στα Artifacts (APK ρολογιού για δοκιμή).
name: Alkyon watches
on:
  push:
    branches: [watch-apps]
    paths: ['android/**', 'ios/**', 'watch/**', '.github/workflows/watch.yml', 'v4/garmin.js', 'native.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Αρχεία εφαρμογής → www → android
        run: |
          node tools/build-web.mjs www --native
          npx cap sync android
      - name: Χτίσιμο ρολογιού (Wear OS) και κινητού
        working-directory: android
        run: ./gradlew --no-daemon :wear:assembleDebug :app:assembleDebug -PalkVersionName=0.0.1 -PalkVersionCode=1
      - uses: actions/upload-artifact@v4
        with:
          name: alkyon-wear-debug
          path: android/wear/build/outputs/apk/debug/*.apk
          retention-days: 14

  watchos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Xcode: $X"; [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || { echo "Κατεβάζω το watchOS SDK"; xcodebuild -downloadPlatform watchOS; xcodebuild -showsdks | grep -i watch; }
      - run: npm ci --no-audit --no-fund
      - name: Αρχεία εφαρμογής → www → ios
        run: |
          node tools/build-web.mjs www --native
          npx cap sync ios
      - name: Χτίσιμο ρολογιού (watchOS, προσομοιωτής)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -target AlkyonWatch -configuration Release -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build > /tmp/watch.log 2>&1 || { grep -E "error:|error\b" -A3 /tmp/watch.log | head -150; tail -40 /tmp/watch.log; exit 1; }
          grep -c "warning:" /tmp/watch.log || true; tail -5 /tmp/watch.log
      - name: Χτίσιμο iPhone με το ρολόι μέσα (iOS, προσομοιωτής)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > /tmp/ios.log 2>&1 || { grep -E "error:" -A3 /tmp/ios.log | head -150; tail -40 /tmp/ios.log; exit 1; }
          tail -5 /tmp/ios.log
