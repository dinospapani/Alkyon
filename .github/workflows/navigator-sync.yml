name: Alkyon Navigator sync
# Μηνιαία ενημέρωση του navigator-mpa.json από το ProtectedSeas Navigator API (ανοιχτό, χωρίς κλειδί).
# Αν κάτι δεν πάει καλά (σφάλμα δικτύου, ύποπτη απάντηση, πολλές διαγραφές), το script σταματά και το αρχείο δεν αλλάζει.
on:
  schedule:
    - cron: '17 4 3 * *'            # μηνιαία: μόνο ό,τι άλλαξε (Alex, ProtectedSeas: «incremental updates»)
    - cron: '41 5 10 1,4,7,10 *'    # κάθε τρίμηνο: πλήρης έλεγχος όλου του καταλόγου («reconciliation»)
  workflow_dispatch:
    inputs:
      since:
        description: 'Από ημερομηνία (YYYY-MM-DD), κενό = από την τελευταία ενημέρωση'
        required: false
      probe:
        description: 'ps_id για έλεγχο (τυπώνει τα στοιχεία της περιοχής, π.χ. AIGRC277)'
        required: false
concurrency:
  group: navigator-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Έλεγχος περιοχής
        if: ${{ github.event.inputs.probe != '' && github.event.inputs.probe != null }}
        run: |
          curl -s -A "Alkyon-sync/1.0" "https://map.navigatormap.org/api/detail/?ps_id=${{ github.event.inputs.probe }}&lang=en_EN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({k:(v if not isinstance(v,(dict,list)) or k in ('regulations','designations') else '...') for k,v in d.items()}, ensure_ascii=False, indent=1)[:6000])" || true
      - run: node navigator-sync.mjs
        env:
          NAV_SINCE: ${{ github.event.inputs.since || (github.event.schedule == '41 5 10 1,4,7,10 *' && '2000-01-01') || '' }}
      - name: Commit αν άλλαξε
        run: |
          if git diff --quiet -- navigator-mpa.json; then echo "Καμία αλλαγή"; exit 0; fi
          git config user.name "alkyon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add navigator-mpa.json
          git commit -m "Navigator: ενημέρωση περιοχών"
          git pull --rebase --autostash
          git push
