<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06171F">
<meta name="robots" content="noindex">
<title>Alkyon · Μεταφορά δεδομένων</title>
<style>html,body{margin:0;height:100%;background:#06171F;color:#E6F1F2;font:16px system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:20px}p{max-width:420px;line-height:1.45}.mut{color:#8FA9B3;font-size:14px}</style>
<script>
/* Alkyon 1.12.0 · μεταφορά δεδομένων από την παλιά διεύθυνση (dinospapani.github.io/Alkyon) στη νέα (alkyonfishing.com).
   Ο browser κρατά τα δεδομένα χωριστά ανά διεύθυνση, άρα η νέα δεν βλέπει τα παλιά. Το alkyonfishing.com ανοίγει αυτή τη σελίδα
   σε νέο παράθυρο (με το migrate.js › alkyonHandoff). Εδώ, στην παλιά διεύθυνση, διαβάζονται:
   - όλα τα κλειδιά του localStorage (ημερολόγιο, ρυθμίσεις, σύνδεση λογαριασμού)
   - όλες οι βάσεις IndexedDB (φωτογραφίες, ηχητικές σημειώσεις, βάθη, ουρά αποστολής)
   και στέλνονται με postMessage ΜΟΝΟ στο https://alkyonfishing.com. Τίποτα δεν σβήνεται εδώ, εκτός από τη συνδρομή ειδοποιήσεων
   της παλιάς διεύθυνσης (για να μην έρχονται διπλές), και μόνο αφού η νέα επιβεβαιώσει ότι τα έγραψε. */
(function(){
'use strict';
var NEWO='https://alkyonfishing.com', KNOWN=['alkyon','alkyon-audio','alkyon-depth','bc4q'];
function say(t,s){ document.getElementById('t').textContent=t; if(s!=null) document.getElementById('s').textContent=s; }
function dbNames(){ return (indexedDB.databases?indexedDB.databases().then(function(a){ return a.map(function(d){ return d.name; }); }).catch(function(){ return KNOWN; }):Promise.resolve(KNOWN))
  .then(function(a){ KNOWN.forEach(function(n){ if(a.indexOf(n)<0) a.push(n); }); return a; }); }
function dumpDB(name){ return new Promise(function(res){
  var r=indexedDB.open(name); var created=false;
  r.onupgradeneeded=function(){ created=true; };   /* δεν υπήρχε: θα σβηστεί παρακάτω */
  r.onerror=function(){ res(null); };
  r.onsuccess=function(){ var db=r.result, out={name:name,version:db.version,stores:[]};
    var names=[].slice.call(db.objectStoreNames);
    if(created||!names.length){ db.close(); if(created) try{ indexedDB.deleteDatabase(name); }catch(e){} return res(null); }
    var t=db.transaction(names,'readonly');
    names.forEach(function(sn){ var st=t.objectStore(sn), d={name:sn,keyPath:st.keyPath,autoIncrement:st.autoIncrement,indexes:[],rows:[]};
      [].slice.call(st.indexNames).forEach(function(ix){ var i=st.index(ix); d.indexes.push({name:ix,keyPath:i.keyPath,unique:i.unique,multiEntry:i.multiEntry}); });
      var c=st.openCursor(); c.onsuccess=function(){ var x=c.result; if(x){ d.rows.push([x.primaryKey,x.value]); x.continue(); } };
      out.stores.push(d); });
    t.oncomplete=function(){ db.close(); res(out); }; t.onerror=function(){ db.close(); res(null); }; };
}); }
function collect(){
  var ls={}; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); ls[k]=localStorage.getItem(k); } }catch(e){}
  return dbNames().then(function(ns){ return Promise.all(ns.map(dumpDB)); }).then(function(dbs){ return {ls:ls,idb:dbs.filter(Boolean)}; });
}
function dropPush(){ try{ if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ if(r.pushManager) r.pushManager.getSubscription().then(function(s){ if(s) s.unsubscribe(); }).catch(function(){}); }); }).catch(function(){}); }catch(e){} }

var data=null, sent=false;
window.addEventListener('message',function(ev){
  if(ev.origin!==NEWO||!ev.data) return;
  if(ev.data.type==='alk-handoff-ready'&&data&&!sent){ sent=true; ev.source.postMessage({type:'alk-handoff',v:1,data:data},NEWO); say('Αποστολή…','Sending…'); }
  if(ev.data.type==='alk-handoff-done'){ dropPush(); try{ localStorage.setItem('alkyon-handed-off',String(Date.now())); }catch(e){}
    say('Έτοιμο ✓','Τα δεδομένα πέρασαν στο alkyonfishing.com. Αυτό το παράθυρο κλείνει.'); setTimeout(function(){ try{ window.close(); }catch(e){} },1500); }
});
document.addEventListener('DOMContentLoaded',function(){
  if(!window.opener){ say('Αυτή η σελίδα ανοίγει από το alkyonfishing.com','This page is opened from alkyonfishing.com'); return; }
  collect().then(function(d){ data=d;
    var n=Object.keys(d.ls).length, p=d.idb.reduce(function(a,db){ return a+db.stores.reduce(function(b,s){ return b+s.rows.length; },0); },0);
    say('Βρέθηκαν '+n+' ρυθμίσεις/εγγραφές και '+p+' αρχεία','Found '+n+' entries and '+p+' files');
    try{ window.opener.postMessage({type:'alk-handoff-hello'},NEWO); }catch(e){}
  }).catch(function(e){ say('Δεν διαβάστηκαν τα δεδομένα', String(e&&e.message||e)); });
});
})();
</script>
</head>
<body><div><p id="t">Ανάγνωση δεδομένων…</p><p class="mut" id="s">Alkyon · μεταφορά στη νέα διεύθυνση</p></div></body>
</html>
