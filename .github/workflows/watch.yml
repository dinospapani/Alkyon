# Alkyon · έλεγχος χτισίματος των ρολογιών (Wear OS και Apple Watch) και του κινητού με τη σύνδεση ρολογιού.
# Δεν ανεβάζει τίποτα σε Play / TestFlight: μόνο χτίζει και κρατά τα αρχεία στα Artifacts (APK ρολογιού για δοκιμή).
name: Alkyon watches
on:
  push:
    branches: [watch-apps]
    paths: ['android/**', 'ios/**', 'watch/**', '.github/workflows/watch.yml', 'v4/garmin.js', 'native.js']
  workflow_dispatch:
permissions:
  contents: write   # μόνο για το κλαδί «watch-shots» με τα στιγμιότυπα (έλεγχος εμφάνισης)
concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Αρχεία εφαρμογής → www → android
        run: |
          node tools/build-web.mjs www --native
          npx cap sync android
      - name: Χτίσιμο ρολογιού (Wear OS) και κινητού
        working-directory: android
        run: ./gradlew --no-daemon :wear:assembleDebug :app:assembleDebug -PalkVersionName=0.0.1 -PalkVersionCode=1
      - uses: actions/upload-artifact@v4
        with:
          name: alkyon-wear-debug
          path: android/wear/build/outputs/apk/debug/*.apk
          retention-days: 14

  watchos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); echo "Xcode: $X"; [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || { echo "Κατεβάζω το watchOS SDK"; xcodebuild -downloadPlatform watchOS; xcodebuild -showsdks | grep -i watch; }
      - run: npm ci --no-audit --no-fund
      - name: Αρχεία εφαρμογής → www → ios
        run: |
          node tools/build-web.mjs www --native
          npx cap sync ios
      - name: Χτίσιμο ρολογιού (watchOS, προσομοιωτής)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -target AlkyonWatch -configuration Release -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build > /tmp/watch.log 2>&1 || { grep -E "error:|error\b" -A3 /tmp/watch.log | head -150; tail -40 /tmp/watch.log; exit 1; }
          grep -c "warning:" /tmp/watch.log || true; tail -5 /tmp/watch.log
      # 1.14.88: τα Series 4–8 και SE είναι arm64_32 (Int 32-bit). Ο προσομοιωτής είναι 64-bit και δεν έπιασε το crash του 🐟.
      # α) έλεγχοι λογικής με τα όρια του Int32 και αποθήκευση/συνέχιση εξόδου (τρέχουν στο macOS)
      - name: Έλεγχοι λογικής ρολογιού (όρια 32-bit, αποθήκευση εξόδου)
        run: |
          swiftc ios/App/AlkyonShared/Shared.swift ios/App/AlkyonShared/Strings.swift ios/App/AlkyonWatch/Core.swift watch/tests/main.swift -o /tmp/wt
          /tmp/wt
      # β) χτίσιμο για πραγματικό ρολόι arm64_32 (χωρίς υπογραφή): πιάνει ό,τι δεν μεταγλωττίζεται σε 32-bit (π.χ. σταθερές που δεν χωράνε)
      - name: Χτίσιμο ρολογιού για arm64_32 (Series 4–8, SE)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -target AlkyonWatch -configuration Release -sdk watchos ARCHS=arm64_32 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > /tmp/watch32.log 2>&1 || { grep -E "error:" -A3 /tmp/watch32.log | head -150; tail -40 /tmp/watch32.log; exit 1; }
          tail -3 /tmp/watch32.log
          B=$(find build -path '*watchos*' -name AlkyonWatch -type f -perm +111 | head -1); echo "binary: $B"; [ -n "$B" ] && lipo -archs "$B" | tee /tmp/archs.txt && grep -q arm64_32 /tmp/archs.txt
      - name: Χτίσιμο iPhone με το ρολόι μέσα (iOS, προσομοιωτής)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > /tmp/ios.log 2>&1 || { grep -E "error:" -A3 /tmp/ios.log | head -150; tail -40 /tmp/ios.log; exit 1; }
          tail -5 /tmp/ios.log
      - name: Στιγμιότυπα Apple Watch (προσομοιωτής)
        run: |
          cd ios/App && xcodebuild -project App.xcodeproj -target AlkyonWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build > /tmp/wd.log 2>&1 || tail -30 /tmp/wd.log
          cd ../.. && bash watch/watchos-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchos-shots
          path: shots/
          retention-days: 7

  wear-shots:
    needs: wear
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alkyon-wear-debug
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Στιγμιότυπα Wear OS (προσομοιωτής)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash watch/wear-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-shots
          path: shots/
          retention-days: 7

  shots:
    needs: [watchos, wear-shots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Στιγμιότυπα → κλαδί «watch-shots»
        run: |
          mkdir -p /tmp/s && cd /tmp/s && git init -q -b watch-shots
          cp -r "$GITHUB_WORKSPACE/all/watchos-shots" watchos 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/all/wear-shots" wear 2>/dev/null || true
          echo "${{ github.sha }}" > SHA
          git add -A && git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "shots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" watch-shots
