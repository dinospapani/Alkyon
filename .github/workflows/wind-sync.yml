# Alkyon · κοινό πλέγμα ανέμου για τα νερά της Κύπρου, κάθε 3 ώρες.
# Γράφει ΜΟΝΟ στο κλαδί wind-data (ένα αρχείο, χωρίς ιστορικό), όχι στο main.
name: Wind grid sync (Open-Meteo)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write

concurrency:
  group: wind-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build cy-wind.json
        run: |
          mkdir -p out
          python3 wind_build.py out/cy-wind.json
          ls -l out

      - name: Publish to branch wind-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b wind-data
          git config user.name "alkyon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cy-wind.json
          git commit -qm "Wind grid $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" wind-data
