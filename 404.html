<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06171F">
<title>Alkyon</title>
<style>html,body{margin:0;height:100%;background:#06171F;color:#E6F1F2;font:16px system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:16px}a{color:#FF7A4D}</style>
<script>
/* Alkyon 1.10.11: σελίδα που δεν υπάρχει. Οι παλιοί σύνδεσμοι της κλασικής (classic.html?a=…, σύνδεσμοι email)
   πηγαίνουν στη ρίζα με τα ίδια στοιχεία, και η ρίζα τους στέλνει στη σωστή σελίδα της εφαρμογής. */
(function(){
  var p=location.pathname, base=p.replace(/[^\/]*$/,''), root=/^\/alkyon\//i.test(p)?p.slice(0,8):'/';
  if(/classic\.html$/i.test(p)) location.replace(base+location.search+location.hash);
  else if(/access_token|type=recovery|error_description/.test(location.hash)) location.replace(root+'v4/'+location.hash);
})();
</script>
</head>
<body><p>Η σελίδα δεν βρέθηκε · Page not found<br><br><a href="/Alkyon/v4/">Άνοιγμα Alkyon · Open Alkyon</a></p></body>
</html>
