name: Greek coastal places (OSM)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/places_build.py"
      - ".github/workflows/places-sync.yml"
  schedule:
    - cron: "41 3 1 */3 *"

permissions:
  contents: write

concurrency:
  group: places-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build gr-places.js
        run: python3 tools/places_build.py

      - name: Commit if changed
        run: |
          git config user.name "bitecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gr-places.js
          git diff --cached --quiet || git commit -m "Greek coastal places update"
          git pull --rebase --autostash
          git push
