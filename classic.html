<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06171F">
<title>Alkyon</title>
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#06171F;color:#E6F1F2;font:16px system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:16px}a{color:#FF7A4D}</style>
<script>
/* Alkyon 1.4.0: η κλασική έκδοση αποσύρθηκε. Όλα γίνονται πλέον στη νέα εφαρμογή (v4/), με τα ίδια δεδομένα στο κινητό.
   Οι παλιοί σύνδεσμοι (?a=…, σύνδεσμοι email) περνούν εκεί. Η παλιά έκδοση υπάρχει στο ιστορικό του repo. */
(function(){
  var q={}; try{ new URLSearchParams(location.search).forEach(function(v,k){ q[k]=v; }); }catch(e){}
  var M={bite:'#new',trip:'#trip',fc:'#forecast',log:'#log',prof:'#profile',map:'#map'}, to='#forecast';
  if(/access_token|type=recovery|error_description/.test(location.hash)) to=location.hash;
  else if(q.a==='map'&&q.lat&&q.lon) to='#share='+(+q.lat).toFixed(5)+','+(+q.lon).toFixed(5);
  else if(M[q.a]) to=M[q.a];
  else if(location.hash.length>1) to=location.hash;
  location.replace('v4/'+to);
})();
</script>
</head>
<body><p>Alkyon… <a href="v4/">Άνοιγμα</a></p></body>
</html>
