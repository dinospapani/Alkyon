# Alkyon 1.9.20 · ραντάρ του Τμήματος Μετεωρολογίας Κύπρου (dom.org.cy, HDF5) → εικόνες για τον χάρτη, κάθε 10 λεπτά.
# Γράφει ΜΟΝΟ στο κλαδί radar-data (χωρίς ιστορικό: κάθε φορά αντικαθίσταται), όχι στο main.
# Η εφαρμογή διαβάζει https://raw.githubusercontent.com/dinospapani/alkyon/radar-data/radar.json
name: Radar sync (DoM Cyprus)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Python packages
        run: pip install --quiet h5py numpy pillow paho-mqtt

      - name: Previous frames
        run: |
          mkdir -p prev
          if git fetch -q --depth 1 origin radar-data 2>/dev/null; then
            git --work-tree=prev checkout -q origin/radar-data -- . || true
          fi
          ls prev | head

      - name: Build radar frames
        run: |
          mkdir -p out
          python3 radar_build.py out --prev prev
          ls -l out

      - name: Publish to branch radar-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b radar-data
          git config user.name "alkyon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Radar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" radar-data
